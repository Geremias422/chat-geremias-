<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privado - Geremias & Daniella</title>
    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --geremias-bg: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --daniella-bg: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-color: #f8f9fa;
            --text-main: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden; 
        }

        /* Ecrã de Login */
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100dvh; 
            background: var(--primary-gradient); 
            padding: 20px; 
            color: white;
            text-align: center;
        }
        
        #login-screen h2 { 
            margin-bottom: 30px; 
            font-size: 26px; 
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .user-btn { 
            padding: 14px 40px; 
            margin: 12px; 
            font-size: 18px; 
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px);
            color: white; 
            border: 2px solid rgba(255, 255, 255, 0.4); 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-btn:hover, .user-btn:active { 
            background: white; 
            color: #764ba2; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        /* Ecrã do Chat */
        #chat-screen { 
            display: none; 
            flex-direction: column; 
            height: 100dvh; 
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
            background: #ffffff; 
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            position: relative;
        }

        header { 
            background: var(--primary-gradient); 
            color: white; 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }

        #room-title { font-size: 17px; font-weight: 600; }

        #logout-btn { 
            background: rgba(255, 255, 255, 0.2); 
            border: none; 
            color: white; 
            padding: 6px 12px;
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500;
            transition: background 0.2s;
        }

        #logout-btn:hover { background: rgba(255, 255, 255, 0.3); }

        #messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            background-color: #f4f6f9; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .message { 
            max-width: 75%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 15px; 
            line-height: 1.4; 
            word-wrap: break-word; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.geremias { 
            background: var(--geremias-bg); 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }

        .message.daniella { 
            background: var(--daniella-bg); 
            color: white; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }

        .message .sender { 
            font-size: 11px; 
            margin-bottom: 4px; 
            font-weight: 700; 
            opacity: 0.85; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #form { 
            display: flex; 
            padding: 12px 15px; 
            background: #ffffff; 
            border-top: 1px solid #eaeaea; 
            align-items: center;
            gap: 10px;
        }

        #input { 
            flex: 1; 
            padding: 12px 18px; 
            border: 1px solid #ddd; 
            border-radius: 25px; 
            outline: none; 
            font-size: 15px; 
            background-color: #f8f9fa;
            transition: border-color 0.2s, background-color 0.2s;
        }

        #input:focus { 
            border-color: #667eea; 
            background-color: #fff;
        }

        #send-btn { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 12px 22px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
            transition: opacity 0.2s, transform 0.1s;
        }

        #send-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <!-- Ecrã de Login -->
    <div id="login-screen">
        <h2>✨ Chat Privado ✨<br><span style="font-size: 18px; font-weight: 400; opacity: 0.9;">Geremias & Daniella</span></h2>
        <button class="user-btn" onclick="login('Geremias')">Geremias</button>
        <button class="user-btn" onclick="login('Daniella')">Daniella</button>
    </div>

    <!-- Ecrã do Chat -->
    <div id="chat-screen">
        <header>
            <span id="room-title">Chat Privado</span>
            <button id="logout-btn" onclick="logout()">Trocar Utilizador</button>
        </header>
        <div id="messages"></div>
        <form id="form" onsubmit="sendMessage(event)">
            <input id="input" type="text" placeholder="Escreva uma mensagem..." autocomplete="off" required />
            <button id="send-btn" type="submit">Enviar</button>
        </form>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD-EXEMPLO-SUBSTITUIR-SE-NECESSARIO",
            authDomain: "chat-geremias-daniella.firebaseapp.com",
            projectId: "chat-geremias-daniella",
            storageBucket: "chat-geremias-daniella.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcde"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('chat_user') || '';

        if (currentUser) {
            showChat();
        }

        function login(user) {
            currentUser = user;
            localStorage.setItem('chat_user', user);
            showChat();
        }

        function logout() {
            localStorage.removeItem('chat_user');
            currentUser = '';
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        function showChat() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('room-title').innerText = `Chat - ${currentUser}`;
            loadMessages();
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('input');
            if (!input.value.trim()) return;

            db.collection('messages').add({
                text: input.value,
                sender: currentUser,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = '';
            }).catch(error => {
                console.error("Erro ao enviar mensagem: ", error);
            });
        }

        function loadMessages() {
            const messagesDiv = document.getElementById('messages');
            db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
                messagesDiv.innerHTML = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('message');
                    msgDiv.classList.add(msg.sender === 'Geremias' ? 'geremias' : 'daniella');
                    
                    const senderDiv = document.createElement('div');
                    senderDiv.classList.add('sender');
                    senderDiv.innerText = msg.sender;
                    
                    const textDiv = document.createElement('div');
                    textDiv.innerText = msg.text;

                    msgDiv.appendChild(senderDiv);
                    msgDiv.appendChild(textDiv);
                    messagesDiv.appendChild(msgDiv);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }
    </script>
</body>
</html>
