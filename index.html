<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/chat-geremias-/manifest.json">
    <title>Geremias & Daniella</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            color: #e0e0e0;
        }

        /* Cabeçalho e Contador */
        header {
            background-color: #1f1f1f;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #2c2c2c;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
            color: #ff4b72;
            margin-bottom: 4px;
        }

        #counter {
            font-size: 0.8rem;
            color: #a0a0a0;
        }

        /* Área de Mensagens */
        #chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.received {
            background-color: #262626;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            background-color: #ff4b72;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Caixa de Envio */
        .input-area {
            background-color: #1f1f1f;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #2c2c2c;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff4b72;
        }

        button {
            background-color: #ff4b72;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #e03b5f;
        }
    </style>
</head>
<body>

    <header>
        <h1>Geremias & Daniella ❤️</h1>
        <div id="counter">A carregar tempo juntos...</div>
    </header>

    <div id="chat-container">
        <div class="message received">Olá, meu amor! Bem-vindo ao nosso cantinho especial. 🥰</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Escreve uma mensagem..." autocomplete="off">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // --- CONTADOR DE TEMPO JUNTOS ---
        // Altere a data abaixo para o dia em que começaram a namorar (Ano, Mês-1, Dia)
        // Exemplo: 1 de Janeiro de 2024 seria new Date(2024, 0, 1)
        const startDate = new Date(2024, 0, 1); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('counter').innerText = 
                `Juntos há ${days} dias, ${hours}h ${minutes}m ${seconds}s ❤️`;
        }

        setInterval(updateCounter, 1000);
        updateCounter();

        // --- FUNÇÃO DE ENVIAR MENSAGEM ---
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (text !== "") {
                const container = document.getElementById('chat-container');
                
                // Cria a mensagem enviada
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message sent';
                msgDiv.innerText = text;
                container.appendChild(msgDiv);

                input.value = "";
                container.scrollTop = container.scrollHeight;
            }
        }

        // Enviar com a tecla Enter
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
